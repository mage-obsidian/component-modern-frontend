name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    name: Syntax-check vite harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Parse-only check: validates ESM syntax without resolving the
      # mage-obsidian package (not installed in CI).
      - name: Syntax-check vite.config.js
        run: node --check vite/vite.config.js
      - name: Published pnpm workspace pins no machine paths
        run: |
          if grep -nE '^\s*storeDir:|^\s*minimumReleaseAge:|:\s*/' vite/pnpm-workspace.yaml; then
            echo "vite/pnpm-workspace.yaml must not carry machine-specific settings" >&2
            exit 1
          fi
